services:
  app:
    build: .
    image: eng-data-challenge:local
    volumes:
      - .:/app
    environment:
      PYSPARK_SUBMIT_ARGS: --driver-memory 3g pyspark-shell

  notebook:
    image: eng-data-challenge:local
    volumes:
      - .:/app
    environment:
      PYSPARK_SUBMIT_ARGS: --driver-memory 3g pyspark-shell
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI
    command: >-
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.token= --ServerApp.password= --notebook-dir=/app/notebooks
    profiles: ["notebook"]
